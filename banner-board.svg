<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Hi there, I'm Rafael Azzolini — Junior Full-Stack Developer. Building Vistobra; expanding into Backend and AWS with Python and Go; −44% material waste at PepsiCo and −34% HR load via a RAG agent; Computer Engineer with a dual degree between Spain and Brazil; based in São Paulo, SP, open to on-site, hybrid or remote. Greeting shown in Portuguese, English, Spanish and Catalan.">
  <title>Hi there, I'm Rafael Azzolini — Junior Full-Stack Developer</title>

  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .flap { transform-box: fill-box; transform-origin: center; }
    .g0 { animation: g0 12s infinite; }
    .g1 { animation: g1 12s infinite; }
    .g2 { animation: g2 12s infinite; }
    .g3 { animation: g3 12s infinite; }
    @keyframes g0 {
      0%,23%   { opacity:1; transform:scaleY(1); }
      25%,98%  { opacity:0; transform:scaleY(.06); }
      100%     { opacity:1; transform:scaleY(1); }
    }
    @keyframes g1 {
      0%,23%   { opacity:0; transform:scaleY(.06); }
      25%,48%  { opacity:1; transform:scaleY(1); }
      50%,100% { opacity:0; transform:scaleY(.06); }
    }
    @keyframes g2 {
      0%,48%   { opacity:0; transform:scaleY(.06); }
      50%,73%  { opacity:1; transform:scaleY(1); }
      75%,100% { opacity:0; transform:scaleY(.06); }
    }
    @keyframes g3 {
      0%,73%   { opacity:0; transform:scaleY(.06); }
      75%,98%  { opacity:1; transform:scaleY(1); }
      100%     { opacity:0; transform:scaleY(.06); }
    }

    /* two segments circling the border, continuous and constant, phase-offset by half */
    .line { animation: travel 12s linear infinite; }
    .lag  { animation-delay: -6s; }
    @keyframes travel {
      from { stroke-dashoffset: 100; }
      to   { stroke-dashoffset: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .flap { animation: none; opacity: 0; transform: none; }
      .g0   { opacity: 1; }
      .line { animation: none; }
      .lag  { stroke-dashoffset: 50; }
    }
  </style>

  <rect width="1200" height="360" fill="#0B0B0D" />

  <!-- static border track -->
  <path d="M38 24 H1162 A14 14 0 0 1 1176 38 V322 A14 14 0 0 1 1162 336 H38 A14 14 0 0 1 24 322 V38 A14 14 0 0 1 38 24 Z"
        fill="none" stroke="#5C3E20" stroke-width="2" />

  <!-- two travelling segments on the closed loop -->
  <path class="line" pathLength="100"
        d="M38 24 H1162 A14 14 0 0 1 1176 38 V322 A14 14 0 0 1 1162 336 H38 A14 14 0 0 1 24 322 V38 A14 14 0 0 1 38 24 Z"
        fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"
        stroke-dasharray="16 84" filter="url(#glow)" />
  <path class="line lag" pathLength="100"
        d="M38 24 H1162 A14 14 0 0 1 1176 38 V322 A14 14 0 0 1 1162 336 H38 A14 14 0 0 1 24 322 V38 A14 14 0 0 1 38 24 Z"
        fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"
        stroke-dasharray="16 84" filter="url(#glow)" />

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">

    <!-- greeting flap box (changes every 4s) -->
    <rect x="70" y="46" width="305" height="58" rx="8" fill="#1C1E22" stroke="#32353C" stroke-width="1" />
    <path d="M70 75 H375" stroke="#0B0B0D" stroke-width="1.5" />
    <g font-size="28" font-weight="700" letter-spacing="1.5" fill="#E8B04B" text-anchor="middle">
      <text class="flap g0" x="222" y="85" xml:lang="pt">Oi, eu sou</text>
      <text class="flap g1" x="222" y="85" xml:lang="en">Hi there, I'm</text>
      <text class="flap g2" x="222" y="85" xml:lang="es">Hola, soy</text>
      <text class="flap g3" x="222" y="85" xml:lang="ca">Hola, sóc</text>
    </g>

    <!-- name (static) + role -->
    <text x="402" y="82" font-size="40" font-weight="700" letter-spacing="2" fill="#F2EFE9">RAFAEL AZZOLINI</text>
    <text x="404" y="106" font-size="14" letter-spacing="4.5" fill="#7E8792">JUNIOR FULL-STACK DEVELOPER</text>

    <!-- separator -->
    <path d="M70 124 H1130" stroke="#26282E" stroke-width="1.5" />

    <!-- about, as work-format columns -->
    <g font-size="11" letter-spacing="3" fill="#5C646E">
      <text x="60" y="150">FOCUS</text>
      <text x="280" y="150">DETAIL</text>
    </g>

    <g>
      <rect x="40" y="162" width="1120" height="28" rx="3" fill="#131419" />
      <rect x="40" y="194" width="1120" height="28" rx="3" fill="#131419" />
      <rect x="40" y="226" width="1120" height="28" rx="3" fill="#131419" />
      <rect x="40" y="258" width="1120" height="28" rx="3" fill="#131419" />
      <rect x="40" y="290" width="1120" height="28" rx="3" fill="#131419" />
    </g>

    <g font-size="14" letter-spacing="2.5" fill="#E8B04B">
      <text x="60" y="181">BUILDING</text>
      <text x="60" y="213">LEARNING</text>
      <text x="60" y="245">IMPACT</text>
      <text x="60" y="277">EDUCATION</text>
      <text x="60" y="309">BASED</text>
    </g>

    <g font-size="16" letter-spacing="0.4" fill="#C7CDD4">
      <text x="280" y="181">Vistobra — turning the jobsite into live, photo-backed data</text>
      <text x="280" y="213">Backend &amp; AWS · Python · Go</text>
      <text x="280" y="245">−44% material waste @ PepsiCo · −34% HR load via a RAG agent</text>
      <text x="280" y="277">Computer Engineer · dual degree Spain 🤝 Brazil</text>
      <text x="280" y="309">São Paulo, SP · on-site / hybrid / remote</text>
    </g>

  </g>
</svg>
