<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Rafael Azzolini — Junior Full-Stack Developer. Computer Engineer, dual degree Brazil and Spain. Speaks Portuguese, English, Spanish and Catalan.">
  <title>Rafael Azzolini — Junior Full-Stack Developer</title>

  <defs>
    <pattern id="pour" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0V9" fill="none" stroke="#6E4A26" stroke-width="1" />
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="board">
      <rect x="20" y="20" width="1160" height="260" rx="14" />
    </clipPath>
  </defs>

  <style>
    .pulse {
      stroke-dasharray: 9 91;
      animation: run 3.4s linear infinite;
    }
    @keyframes run {
      from { stroke-dashoffset: 100; }
      to   { stroke-dashoffset: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pulse { animation: none; stroke-dashoffset: 46; }
    }
  </style>

  <!-- substrate -->
  <rect width="1200" height="300" fill="#0C1210" />
  <rect x="20" y="20" width="1160" height="260" rx="14" fill="#101815" stroke="#2A3A33" stroke-width="1.5" />

  <!-- copper pour, right field only -->
  <g clip-path="url(#board)">
    <rect x="660" y="20" width="520" height="260" fill="url(#pour)" opacity="0.16" />
  </g>

  <!-- mounting holes -->
  <g fill="#0C1210" stroke="#C4813F" stroke-width="2" opacity="0.65">
    <circle cx="48" cy="48" r="7" />
    <circle cx="1152" cy="48" r="7" />
    <circle cx="48" cy="252" r="7" />
    <circle cx="1152" cy="252" r="7" />
  </g>

  <!-- silkscreen identity -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <text x="80" y="96" fill="#C4813F" font-size="14" letter-spacing="4">COMPUTER ENGINEER · DUAL DEGREE</text>
    <text x="80" y="156" fill="#EDE7DC" font-size="54" font-weight="700" letter-spacing="2">RAFAEL AZZOLINI</text>
    <path d="M80 178 H620" stroke="#2A3A33" stroke-width="1.5" />
    <text x="80" y="208" fill="#6FE3B0" font-size="18" letter-spacing="4.5">JUNIOR FULL-STACK DEVELOPER</text>
    <text x="80" y="244" fill="#7A8F84" font-size="12" letter-spacing="3">PT · EN · ES · CA</text>
  </g>

  <!-- secondary routing -->
  <g fill="none" stroke="#6E4A26" stroke-width="2" opacity="0.5" stroke-linecap="square">
    <path d="M700 92 H758 L788 62 H900" />
    <path d="M1152 196 H1092 L1052 236 H962" />
  </g>

  <!-- pads -->
  <g>
    <rect x="712" y="236" width="18" height="18" rx="2" fill="#C4813F" />
    <rect x="1112" y="132" width="18" height="18" rx="2" fill="#C4813F" />
  </g>

  <!-- main net: BR -> ES -->
  <path id="net" pathLength="100" d="M721 245 H812 L868 189 H960 L1008 141 H1121"
        fill="none" stroke="#C4813F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path class="pulse" pathLength="100" d="M721 245 H812 L868 189 H960 L1008 141 H1121"
        fill="none" stroke="#6FE3B0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- SMD parts on the net -->
  <g stroke="#C4813F" stroke-width="1.5" fill="#16211C">
    <rect x="760" y="237" width="28" height="16" rx="1" />
    <rect x="895" y="181" width="28" height="16" rx="1" />
    <rect x="1035" y="133" width="28" height="16" rx="1" />
  </g>

  <!-- silkscreen labels -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="1.5" text-anchor="middle">
    <text x="774" y="229" fill="#EDE7DC">TS</text>
    <text x="909" y="173" fill="#EDE7DC">PY</text>
    <text x="1049" y="125" fill="#EDE7DC">SQL</text>
    <text x="721" y="272" fill="#C4813F" font-size="12" letter-spacing="2.5">BR</text>
    <text x="1121" y="122" fill="#C4813F" font-size="12" letter-spacing="2.5">ES</text>
  </g>
</svg>
